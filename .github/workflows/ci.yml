name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # next build needs these present to evaluate config and route modules. The
      # values are placeholders: nothing connects at build time.
      - name: Build
        run: npm run build
        env:
          DB_DATABASE: placeholder
          DB_USERNAME: placeholder
          JWT_SECRET: ci-build-only-secret-not-used-at-runtime
          NEXT_TELEMETRY_DISABLED: '1'

  e2e:
    name: End-to-end smoke
    runs-on: ubuntu-latest
    # Needs a seeded database, so it runs against a deployed environment when one
    # is configured rather than failing every PR.
    if: vars.E2E_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
